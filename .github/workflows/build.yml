# Owned test matrix (leptris-ruby model): every platform the release
# SHIPS gets its suite RUN here, not just built — x86_64 + aarch64
# linux, arm64 + intel darwin, x64 + arm64 Windows — plus musl and
# armv7 container legs, and a JRuby leg proving the ffi binding.
# This replaces the cimas rake reusable: that workflow resolves
# dependencies fresh (no lockfile), which made rubocop/plugin drift
# break CI independent of repo changes.
#
# The vendored cdylib legs install the ruby-platform gem built from
# this checkout, fetch the latest released omnizip-ffi cdylib, and
# run the installed-gem smoke — the same gate the platform gems get.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on Ruby ${{ matrix.ruby-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest,
             macos-15-intel, windows-latest, windows-11-arm]
        exclude:
          # Ruby 3.3 is unavailable on the windows-arm runner
          - os: windows-11-arm
            ruby-version: "3.3"
        include:
          - { os: windows-11-arm, ruby-version: "3.4" }
          - { os: windows-11-arm, ruby-version: "4.0" }
          - { os: ubuntu-latest, ruby-version: "3.3" }
          - { os: ubuntu-24.04-arm, ruby-version: "3.3" }
          - { os: macos-latest, ruby-version: "3.3" }
          - { os: macos-15-intel, ruby-version: "3.3" }
          - { os: windows-latest, ruby-version: "3.3" }
          - { os: ubuntu-latest, ruby-version: "3.4" }
          - { os: ubuntu-24.04-arm, ruby-version: "3.4" }
          - { os: macos-latest, ruby-version: "3.4" }
          - { os: macos-15-intel, ruby-version: "3.4" }
          - { os: windows-latest, ruby-version: "3.4" }
          - { os: ubuntu-latest, ruby-version: "4.0" }
          - { os: ubuntu-24.04-arm, ruby-version: "4.0" }
          - { os: macos-latest, ruby-version: "4.0" }
          - { os: macos-15-intel, ruby-version: "4.0" }
          - { os: windows-latest, ruby-version: "4.0" }
          - { os: windows-11-arm, ruby-version: "4.0" }
    steps:
      - uses: actions/checkout@v4

      # Interop CLIs the tool-compatibility specs consume (carried
      # over from the cimas rake workflow this replaces). Specs skip
      # when a CLI is absent, so best-effort installs never fail.
      - name: Install interop CLIs
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y unrar 7zip p7zip-full lzip
            command -v 7zz >/dev/null 2>&1 || sudo ln -sf "$(command -v 7z)" /usr/local/bin/7zz
            echo "interop CLIs: 7zz=$(command -v 7zz) 7z=$(command -v 7z) lzip=$(command -v lzip) unrar=$(command -v unrar)"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install 7-zip lzip
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install 7zip
          fi

      # No bundler-cache: restored vendor dirs can resurrect gems from
      # older resolutions (the standard-family crash needed a stale
      # standard-custom in vendor to reproduce). Fresh install from the
      # committed Gemfile constraints on every leg.
      - uses: ruby/setup-ruby@master
        with:
          bundler-cache: false
          ruby-version: ${{ matrix.ruby-version }}

      - name: Bundle install (fresh)
        run: bundle install --jobs 4 --retry 3

      # AFTER setup-ruby (the matrix ruby is where rubocop runs).
      # RuboCop's plugin loader auto-loads lint_roller-plugin gems
      # visible to it; runner images preinstall the standard family,
      # whose sibling requires crash rubocop when half the family
      # resolves. Remove the family before the suite.
      - name: Remove preinstalled standard plugins
        shell: bash
        run: |
          gem uninstall --all --force --executables \
            standard standard-custom standard-performance \
            standard-rubocop-lsp 2>/dev/null || true
          gem list standard || true

      - name: RuboCop plugin diagnostics
        if: runner.os == 'Linux' && matrix.ruby-version == '3.4'
        run: |
          echo "--- gems declaring default_lint_roller_plugin ---"
          ruby -e 'Gem::Specification.find_all.to_a.each { |s| p = s.metadata["default_lint_roller_plugin"]; puts "#{s.name}-#{s.version} -> #{p}" if p }'
          echo "--- resolved config require/plugins ---"
          bundle exec ruby -e '
            require "rubocop"
            cfg = RuboCop::ConfigLoader.load_file(".rubocop.yml")
            puts "plugins: #{Array(cfg["plugins"]).inspect}"
            puts "require: #{Array(cfg["require"]).inspect}"
            puts "rubocop: #{RuboCop::Version.version}"
          '

      - run: bundle exec rake

  smoke-jruby:
    # JRuby's tier path: run the smoke twice — the default layer
    # (JRuby 10 ships a Fiddle, so it may win) and the FORCED ffi
    # layer, which proves the ffi binding works on a JVM engine.
    name: Smoke JRuby (default + ffi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: jruby
          bundler-cache: false

      - name: Build + install the ruby-platform gem
        run: |
          gem build omnizip.gemspec
          # no --local: runtime deps must resolve from rubygems.org
          gem install --no-document omnizip-*.gem

      - name: Fetch the released cdylib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R omnizip/omnizip-rs --limit 50 \
            | awk '{print $1}' | grep '^omnizip-ffi-v' | head -1)
          gh release download "$tag" -R omnizip/omnizip-rs \
            -p 'libomnizip_ffi-x86_64-unknown-linux-gnu.tar.gz' -D dylib
          tar -xzf dylib/libomnizip_ffi-x86_64-unknown-linux-gnu.tar.gz -C dylib

      - name: Smoke, default layer
        env:
          OMNIZIP_FFI_DYLIB: ${{ github.workspace }}/dylib/libomnizip_ffi.so
        run: |
          ruby .github/scripts/test_installed_gem.rb

      - name: Smoke, forced ffi layer
        env:
          OMNIZIP_FFI_DYLIB: ${{ github.workspace }}/dylib/libomnizip_ffi.so
          OMNIZIP_BINDING: ffi
        run: |
          out=$(ruby .github/scripts/test_installed_gem.rb 2>&1) || rc=$?
          echo "$out"
          if [ -n "${rc:-}" ]; then exit "$rc"; fi
          echo "$out" | grep -q "SMOKE OK (ffi layer)"

  smoke-musl:
    # The musl dylibs are cross-built; here they get EXECUTED on real
    # Alpine (host arch and arm64): the musl tarball is passed to the
    # container via OMNIZIP_FFI_DYLIB and a zlib round-trip runs.
    name: Smoke musl (${{ matrix.arch }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64-musl, host: ubuntu-latest,
              platform: "linux/amd64", image: "ruby:3.3-alpine",
              target: "x86_64-unknown-linux-musl" }
          - { arch: aarch64-musl, host: ubuntu-24.04-arm,
              platform: "linux/arm64", image: "ruby:3.3-alpine",
              target: "aarch64-unknown-linux-musl" }
    steps:
      - uses: actions/checkout@v4

      - name: Build the ruby-platform gem + fetch the musl cdylib
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          gem build omnizip.gemspec
          tag=$(gh release list -R omnizip/omnizip-rs --limit 50 \
            | awk '{print $1}' | grep '^omnizip-ffi-v' | head -1)
          gh release download "$tag" -R omnizip/omnizip-rs \
            -p "libomnizip_ffi-${TARGET}.tar.gz" -D dylib
          tar -xzf "dylib/libomnizip_ffi-${TARGET}.tar.gz" -C dylib

      - name: Round-trip inside Alpine
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          OMNIZIP_FFI_DYLIB: ${{ github.workspace }}/dylib/libomnizip_ffi.so
        run: |
          docker run --rm \
            --platform "$PLATFORM" \
            -v "$PWD:/work" -w /work \
            -e OMNIZIP_FFI_DYLIB=/work/dylib/libomnizip_ffi.so \
            "$IMAGE" sh -c '
              set -eux
              # compiling deps (ffi on musl) needs a toolchain
              apk add --no-cache build-base
              gem install --no-document omnizip-*.gem
              ruby -e "
                require \"omnizip\"
                lib = Omnizip::Implementations::Rust::Library
                abort \"FAIL: tier unavailable\" if lib.instance.nil?
                v = lib.dylib_version
                abort \"FAIL: version symbol missing\" if v.nil?
                puts \"musl smoke: cdylib #{v}\"
                data = \"musl smoke \" * 5000
                enc = lib.instance.compress(\"zlib\", data, 6)
                abort \"FAIL: round-trip\" unless lib.instance.decompress(\"zlib\", enc, data.bytesize) == data
                puts \"MUSL SMOKE OK\"
              "
            '

  smoke-armv7:
    # 32-bit ARM gnu dylib under qemu binfmt (no armv7 hosted runner).
    # Experimental: emulated, slow, and the ruby image manifest for
    # arm/v7 has historically wobbled.
    name: Smoke armv7 (qemu, experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Install + smoke inside emulated Debian arm/v7
        env:
          IMAGE: "ruby:3.3-bookworm"
          GH_TOKEN: ${{ github.token }}
        run: |
          gem build omnizip.gemspec
          tag=$(gh release list -R omnizip/omnizip-rs --limit 50 \
            | awk '{print $1}' | grep '^omnizip-ffi-v' | head -1)
          gh release download "$tag" -R omnizip/omnizip-rs \
            -p 'libomnizip_ffi-arm-unknown-linux-gnueabihf.tar.gz' -D dylib
          # the download step fetches a TARBALL — extract it or the
          # container's OMNIZIP_FFI_DYLIB points at a path that does
          # not exist (the cause of every armv7 "tier unavailable"
          # smoke failure to date)
          tar -xzf dylib/libomnizip_ffi-arm-unknown-linux-gnueabihf.tar.gz -C dylib
          docker run --rm \
            --platform 'linux/arm/v7' \
            -v "$PWD:/work" -w /work \
            -e OMNIZIP_FFI_DYLIB=/work/dylib/libomnizip_ffi.so \
            "${IMAGE}" sh -c '
              set -eux
              gem install --no-document omnizip-*.gem
              ruby -e "
                require \"omnizip\"
                lib = Omnizip::Implementations::Rust::Library
                abort \"FAIL: tier unavailable\" if lib.instance.nil?
                v = lib.dylib_version
                abort \"FAIL: version symbol missing\" if v.nil?
                puts \"armv7 smoke: cdylib #{v}\"
                data = \"armv7 smoke \" * 5000
                enc = lib.instance.compress(\"zlib\", data, 6)
                abort \"FAIL: round-trip\" unless lib.instance.decompress(\"zlib\", enc, data.bytesize) == data
                puts \"ARMV7 SMOKE OK\"
              "
            '
