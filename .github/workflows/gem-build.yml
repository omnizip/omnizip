# Build per-platform gems that vendor the prebuilt omnizip-ffi cdylib
# (parsanol distribution model): `gem install omnizip` gets Rust
# acceleration with zero compilation on every platform we ship.
#
#   1. download the cdylib artifacts from the matching omnizip-rs
#      release (built by release-binary.yml),
#   2. rake platform_gems:build DIR=artifacts,
#   3. smoke-test the gems on matching runners (installed-gem gate:
#      tier active + pure-Ruby path with OMNIZIP_NO_RUST=1),
#   4. optionally push (push=true) with the same rubygems credential
#      the ruby-platform release uses.
#
# The plain `ruby` platform gem keeps shipping through the existing
# cimas release workflow — this one only adds platform gems.
name: Build gems

on:
  workflow_dispatch:
    inputs:
      rust_tag:
        description: "omnizip-rs release tag holding the cdylib artifacts (default: latest omnizip-ffi-v*)"
        required: false
        type: string
        default: ""
      ref:
        description: "git ref to build the gem from (default: the branch you dispatch on)"
        required: false
        type: string
        default: ""
      push:
        description: "Push the built platform gems to rubygems (requires the version's ruby gem to exist)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build platform gems
    runs-on: ubuntu-latest
    outputs:
      rust_tag: ${{ inputs.rust_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Resolve the rust release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.rust_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            t="$INPUT_TAG"
          else
            t=$(gh release list -R omnizip/omnizip-rs --limit 50 \
              | awk '{print $1}' | grep '^omnizip-ffi-v' | head -1)
          fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          test -n "$t"

      - name: Download cdylib artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release download "${{ steps.tag.outputs.tag }}" \
            -R omnizip/omnizip-rs --dir artifacts \
            -p 'libomnizip_ffi-*.tar.gz'
          ls -l artifacts/

      - name: Build the gems
        run: bundle exec rake platform_gems:build DIR=artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: platform-gems
          path: pkg/*.gem
          if-no-files-found: error

  smoke:
    name: Smoke ${{ matrix.gem }}
    needs: build
    runs-on: ${{ matrix.os }}
    # aarch64-mingw-ucrt is a REQUIRED leg since canon 0.3.64 dropped
    # nokogiri: the XML stack runs on leptris, which ships a native gem
    # for every platform we do (previously this leg was experimental —
    # nokogiri had no prebuilt and its source build failed here).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gem: "x86_64-linux", os: ubuntu-latest }
          - { gem: "aarch64-linux", os: ubuntu-24.04-arm }
          - { gem: "arm64-darwin", os: macos-14 }
          - { gem: "x86_64-darwin", os: macos-15-intel }
          - { gem: "x64-mingw-ucrt", os: windows-latest }
          - { gem: "aarch64-mingw-ucrt", os: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: "3.4"

      - uses: actions/download-artifact@v4
        with:
          name: platform-gems
          path: pkg/

      - name: Install and smoke the platform gem
        shell: bash
        run: |
          # No --local: the platform gem carries runtime deps (marcel,
          # lutaml-model, …) that must resolve from rubygems.org. The
          # platform gem itself is the only local file.
          gem install --no-document "pkg/omnizip-*-${{ matrix.gem }}.gem"
          ruby .github/scripts/test_installed_gem.rb

  # The musl and 32-bit-arm platform gems were cross-built but the
  # suite never RAN on those libcs/arches (leptris-ruby's doctrine:
  # every platform the release ships gets its suite RUN, not just
  # built). Alpine containers for musl, qemu binfmt for armv7.
  smoke-container:
    name: Smoke ${{ matrix.gem }} (${{ matrix.image }})
    needs: build
    runs-on: ${{ matrix.host }}
    # experimental=true for the armv7 qemu legs (emulated, wobbly
    # image manifests)
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 musl: real Alpine on the host arch
          - { gem: "x86_64-linux-musl", host: ubuntu-latest,
              platform: "linux/amd64", image: "ruby:3.3-alpine",
              experimental: false }
          # aarch64 musl: Alpine arm64 image on the arm64 runner
          - { gem: "aarch64-linux-musl", host: ubuntu-24.04-arm,
              platform: "linux/arm64", image: "ruby:3.3-alpine",
              experimental: false }
          # 32-bit ARM under qemu: Debian for the gnu dylib
          - { gem: "arm-linux", host: ubuntu-latest,
              platform: "linux/arm/v7", image: "ruby:3.3-bookworm",
              experimental: true }
          # 32-bit ARM musl under qemu: Alpine's armv7 ruby
          - { gem: "arm-linux-musl", host: ubuntu-latest,
              platform: "linux/arm/v7", image: "alpine:3.20",
              experimental: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # binfmt registration for the arm/v7 qemu legs; a no-op on
      # native-arch hosts.
      - uses: docker/setup-qemu-action@v3

      - uses: actions/download-artifact@v4
        with:
          name: platform-gems
          path: pkg/

      - name: Install and smoke inside the container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --platform '${{ matrix.platform }}' \
            -v "$PWD:/work" -w /work \
            -e OMNIZIP_GEM="pkg/omnizip-*-${{ matrix.gem }}.gem" \
            "${IMAGE}" sh -c '
              set -eux
              # ffi is a hard runtime dep and has no musl prebuilt —
              # it compiles at install time, so Alpine needs a
              # toolchain (the Debian images ship build-essential).
              case "${{ matrix.image }}" in
                *alpine*)
                  # ruby-dev: mkmf needs the ruby headers (the runtime
              # package alone is not enough to build ffi).
              apk add --no-cache build-base ruby-dev ruby bash ca-certificates
                  ;;
              esac
              gem install --no-document "$OMNIZIP_GEM"
              ruby .github/scripts/test_installed_gem.rb
            '

  # JRuby 10 ships a working Fiddle, so the default tier layer on a
  # JVM may legitimately be either — the smoke therefore runs twice:
  # once on the default layer (any layer is fine, the tier must work)
  # and once with OMNIZIP_BINDING=ffi FORCED, which proves the ffi
  # gem binding actually functions under a JVM engine.
  smoke-jruby:
    name: Smoke JRuby (default + ffi)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@master
        with:
          ruby-version: jruby
          bundler-cache: false

      - name: Build + install the ruby-platform gem
        run: |
          gem build omnizip.gemspec
          # no --local: runtime deps must resolve from rubygems.org
          gem install --no-document omnizip-*.gem

      - name: Fetch the released cdylib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R omnizip/omnizip-rs --limit 50 \
            | awk '{print $1}' | grep '^omnizip-ffi-v' | head -1)
          gh release download "$tag" -R omnizip/omnizip-rs \
            -p 'libomnizip_ffi-x86_64-unknown-linux-gnu.tar.gz' -D dylib
          tar -xzf dylib/libomnizip_ffi-x86_64-unknown-linux-gnu.tar.gz -C dylib

      - name: Smoke, default layer
        env:
          OMNIZIP_FFI_DYLIB: ${{ github.workspace }}/dylib/libomnizip_ffi.so
        run: |
          ruby .github/scripts/test_installed_gem.rb

      - name: Smoke, forced ffi layer
        env:
          OMNIZIP_FFI_DYLIB: ${{ github.workspace }}/dylib/libomnizip_ffi.so
          OMNIZIP_BINDING: ffi
        run: |
          out=$(ruby .github/scripts/test_installed_gem.rb 2>&1) || rc=$?
          echo "$out"
          if [ -n "${rc:-}" ]; then exit "$rc"; fi
          echo "$out" | grep -q "SMOKE OK (ffi layer)"

  push:
    name: Push platform gems through trusted release workflow
    if: ${{ inputs.push }}
    needs: [build, smoke, smoke-container, smoke-jruby]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the trusted release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f next_version=skip \
            -f platform_push=true \
            -f platform_run_id="$RUN_ID"

      - name: Wait for trusted publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow release.yml --event workflow_dispatch --limit 10 \
              --json databaseId,createdAt,status,headBranch \
              --jq '[.[] | select(.headBranch == "main")] | sort_by(.createdAt) | last | .databaseId')
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              status=$(gh run view "$run_id" --repo "${GITHUB_REPOSITORY}" --json status,conclusion \
                --jq '.status + " " + (.conclusion // "")')
              echo "trusted release $run_id: $status"
              case "$status" in
                "completed success") exit 0 ;;
                "completed"*) exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo "trusted release workflow did not complete in time"
          exit 1
