name: Documentation

# NO JEKYLL. Docs are AsciiDoc sources (readme-docs/ + docs/) rendered
# by Coradoc (rake docs:build) into docs/site/, deployed to Pages.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'readme-docs/**'
      - 'README.adoc'
      - 'lib/tasks/docs.rake'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'readme-docs/**'
      - 'README.adoc'
      - 'lib/tasks/docs.rake'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build with Coradoc
        run: bundle exec rake docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
